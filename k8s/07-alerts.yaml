apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-task-alerts
  namespace: devops-task
  labels:
    release: kps
spec:
  groups:
    - name: devops-task.rules
      rules:
        - alert: InstanceDown
          expr: up{job="devops-task-service"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "App instance is down"
        - alert: HighErrorRate
          expr: rate(http_requests_total{code=~"5.."}[5m]) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High error rate detected"