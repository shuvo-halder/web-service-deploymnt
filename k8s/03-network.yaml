apiVersion: v1
kind: Service
metadata:
  name: devops-task-service
spec:
  selector:
    app: web-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-task-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    # This automatically resolves to your K3s VPS IP
    - host: devops-task.103.131.144.65.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-task-service
                port:
                  number: 80