apiVersion: v1
kind: Service
metadata:
  name: devops-task-service
  namespace: devops-task
  labels:
    app: web-service
spec:
  type: ClusterIP
  selector:
    app: web-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-task-ingress
  namespace: devops-task
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: devops-task.velmorabeauty-bd.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-task-service
                port:
                  number: 80