name: Build, Push & Deploy

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Multi-Arch Image
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}},value=v1.0.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-k3s:
    name: Deploy to K3s VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and Rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Set the new image generated in the build step
            NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
            
            echo "Deploying $NEW_IMAGE to K3s..."
            # Update the image in the Kubernetes deployment
            kubectl set image deployment/devops-task-app app=$NEW_IMAGE -n devops-task
            
            echo "Waiting for rollout to complete (Health/Smoke Test)..."
            if ! kubectl rollout status deployment/devops-task-app --timeout=60s -n devops-task; then
              echo "Health check failed! Initiating rollback..."
              kubectl rollout undo deployment/devops-task-app -n devops-task
              echo "Rollback completed. Pipeline will fail."
              exit 1
            else
              echo "Deployment successful and healthy!"
            fi


